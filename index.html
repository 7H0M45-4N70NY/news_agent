<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroNews - AI News Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            padding: 80px 20px 40px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 280px;     /* keep base size */
            height: auto;
            transform: scale(1.3);   /* 🔥 visually bigger */
            transform-origin: center;
            filter: drop-shadow(0 0 35px rgba(0, 120, 255, 0.35));
        }

        /* Form Card */
        form {
            margin-top:-25px;
            background: #151515;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .form-wrapper {
            display: grid;
            gap: 16px;
            margin-bottom: 25px;
        }

        select {
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s ease;
        }

        select:hover {
            border-color: #555;
        }

        select:focus {
            outline: none;
            border-color: #4a8cff;
            background: #222;
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4a8cff;
        }

        .checkbox-group label {
            font-size: 0.9em;
            color: #aaa;
        }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            border: none;
        }

        .btn-generate {
            background: linear-gradient(90deg, #2b6cff, #8e2de2);
            color: white;
        }

        .btn-generate:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
        }

        .btn-clear:hover {
            background: #222;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #333;
            border-top-color: #4a8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #999;
            font-size: 0.9em;
        }

        /* Result */
        .result {
            display: none;
            margin-top: 40px;
        }

        .result.show {
            display: block;
        }

        .article-card {
            background: #151515;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #222;
            margin-bottom: 20px;
            transition: 0.3s ease;
        }

        .article-card:hover {
            border-color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .article-card h2 {
            font-size: 1.4em;
            margin-bottom: 8px;
            color: #fff;
            flex: 1;
        }

        .article-meta {
            display: inline-block;
            padding: 4px 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 0.75em;
            color: #999;
            margin-left: 15px;
            white-space: nowrap;
        }

        .article-card p {
            color: #ccc;
            line-height: 1.8;
            font-size: 0.95em;
        }

        .articles-count {
            text-align: center;
            color: #4a8cff;
            font-size: 0.9em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Error */
        .error {
            display: none;
            padding: 14px;
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            border-radius: 8px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        .error.show {
            display: block;
        }

        /* Token Info */
        .token-info {
            display: none;
            margin-top: 25px;
            padding: 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 0.85em;
            color: #999;
        }

        .token-info.show {
            display: block;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.8em;
        }

        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">
                <img src="assets/logo.png" alt="NeuroNews Logo" class="logo-img">
            </div>
        </div>

        <div class="error" id="error"></div>

        <form id="newsForm">
            <div class="form-wrapper">
                <select id="topic" required>
                    <option value="">Select topic</option>
                    <option value="Technology">Technology</option>
                    <option value="Business">Business</option>
                    <option value="Science">Science</option>
                    <option value="Sports">Sports</option>
                    <option value="Health">Health</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Politics">Politics</option>
                    <option value="World">World News</option>
                    <option value="Education">Education</option>
                    <option value="Environment">Environment</option>
                </select>

                <select id="country" required>
                    <option value="">Select country</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Global">Global</option>
                </select>

                <div class="checkbox-group">
                    <input type="checkbox" id="showTokens" checked>
                    <label for="showTokens">Show token usage</label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-generate">Generate</button>
                <button type="reset" class="btn-clear">Clear</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Generating articles...</div>
        </div>

        <div class="result" id="result">
            <div class="articles-count" id="articlesCount"></div>
            <div id="articlesContainer"></div>
        </div>

        <div class="token-info" id="tokenInfo">
            <strong>📊 API Usage:</strong><br>
            Tokens: <span id="tokenCount">0</span> |
            Cost: <span id="tokenCost">$0.00</span>
        </div>

        <div class="footer">
            Powered by Google Gemini 2.5 Flash Lite
        </div>

    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';

        const form = document.getElementById('newsForm');
        const topicSelect = document.getElementById('topic');
        const countrySelect = document.getElementById('country');
        const showTokensCheckbox = document.getElementById('showTokens');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        const articlesCount = document.getElementById('articlesCount');
        const articlesContainer = document.getElementById('articlesContainer');
        const tokenInfo = document.getElementById('tokenInfo');
        const tokenCount = document.getElementById('tokenCount');
        const tokenCost = document.getElementById('tokenCost');

        topicSelect.value = 'Technology';
        countrySelect.value = 'India';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const topic = topicSelect.value.trim();
            const country = countrySelect.value;

            if (!topic || !country) {
                showError('Please select both topic and country');
                return;
            }

            await generateArticle(topic, country);
        });

        async function generateArticle(topic, country) {
            loading.style.display = 'block';
            error.classList.remove('show');
            result.classList.remove('show');
            tokenInfo.classList.remove('show');

            try {
                // const response = await fetch(`${API_BASE_URL}/generate_news`, {
                const response = await fetch("/generate_news", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, country })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else if (data.articles && data.articles.length > 0) {
                    // Display multiple articles
                    articlesCount.textContent = `📰 ${data.articles.length} Article${data.articles.length > 1 ? 's' : ''} Generated`;
                    articlesContainer.innerHTML = '';
                    
                    data.articles.forEach((article, index) => {
                        const articleCard = document.createElement('div');
                        articleCard.className = 'article-card';
                        
                        const header = document.createElement('div');
                        header.className = 'article-header';
                        
                        const title = document.createElement('h2');
                        title.textContent = article.title;
                        
                        const meta = document.createElement('span');
                        meta.className = 'article-meta';
                        meta.textContent = `${article.word_count} words`;
                        
                        header.appendChild(title);
                        header.appendChild(meta);
                        
                        const content = document.createElement('p');
                        content.textContent = article.content;
                        
                        articleCard.appendChild(header);
                        articleCard.appendChild(content);
                        articlesContainer.appendChild(articleCard);
                    });
                    
                    result.classList.add('show');

                    if (showTokensCheckbox.checked) {
                        await fetchTokenStats();
                    }
                } else {
                    showError('No articles generated');
                }
            } catch (err) {
                showError(`Failed: ${err.message}`);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function fetchTokenStats() {
            try {
                const response = await fetch('/token-stats');
                if (response.ok) {
                    const stats = await response.json();
                    tokenCount.textContent = stats.total_tokens.toLocaleString();
                    tokenCost.textContent = stats.total_cost;
                    tokenInfo.classList.add('show');
                }
            } catch (err) {
                console.log('Token stats unavailable');
            }
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }
    </script>
</body>

</html>
